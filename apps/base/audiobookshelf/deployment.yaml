apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audiobookshelf
  template:
    metadata:
      labels:
        app: audiobookshelf
    spec:
      #securityContext:
      #  fsGroup: 33
      #  runAsUser: 33
      #  runAsGroup: 33

      containers:
        - name: audiobookshelf
          image: ghcr.io/advplyr/audiobookshelf:2.36.0
          ports:
            - containerPort: 3005
              protocol: TCP
         # securityContext:
         #   allowPrivilegeEscalation: false

          volumeMounts:
            - name: audiobookshelf-data
              mountPath: /etc/audiobookshelf/data
          envFrom:
            - configMapRef:
                name: audiobookshelf-configmap
            #- secretRef:
             #   name: audiobookshelf-credentials
      
      restartPolicy: Always

      volumes:
      - name: audiobookshelf-data
        persistentVolumeClaim:
          claimName: audiobookshelf-data-pvc

