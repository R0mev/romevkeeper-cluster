apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate          # RWO config volume — rolling update would deadlock
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      securityContext:
        runAsUser: 1000          # <-- UID that owns the media share on DSM
        runAsGroup: 1000         # <-- its GID
        fsGroup: 1000            # makes the iSCSI config volume writable
        supplementalGroups:
          - 989                  # <-- `getent group render` on the node
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:12.1   
          ports:
            - containerPort: 8096
              protocol: TCP
          env:
            - name: JELLYFIN_PublishedServerUrl
              value: "http://salamander-kitefin.ts.net:30096"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 4Gi       
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: media
              mountPath: /media
              readOnly: true
            - name: dri
              mountPath: /dev/dri
          livenessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 15
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: cache
          emptyDir:
            sizeLimit: 20Gi
        - name: media
          persistentVolumeClaim:
            claimName: jellyfin-media
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory

